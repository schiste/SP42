# Aethyme broker configuration for SP42.
#
# Generated by `aethyme init`, then set for how this repository actually ships.
# Schema 1; unknown keys are ignored at runtime and `aethyme certify` warns.

schema = 1

[promote]
# verify-only, deliberately. The generated default is "auto", which promotes
# verified submissions onto a local `aethyme/integration` branch — and the
# tool's own comment on this key says that mode is for repositories that do NOT
# ship through pull requests, "where a second copy of the work on an integration
# branch costs drift and contributes nothing."
#
# SP42 does ship through pull requests, with required status checks in
# .github/workflows/ci.yml. A second copy of the work on an integration branch
# would be a third place for the code to be, drifting against main and against
# the open PRs. So: verify the merged tree, and let the PR be the only route.
mode = "verify-only"

[delivery]
# The safer delivery route when refs diverge — which they will, since the ADR
# work lands as a stacked chain of branches.
default = "pull_request"

[leases]
# Paths no session should ever claim. Everything here is either generated,
# build output, or local runtime state; leasing any of it would let one agent
# hold a lock that another needs for unrelated work.
ignore = [
    "target/",
    "dist/",
    "coverage/",
    ".aethyme/",
    ".sp42-runtime/",
    ".claude/",
    ".codex/",
    ".chau7/",
    "node_modules/",
    ".tmp/",
]

# [leases.routing] is left unset: SP42 is a single-language workspace, so a
# backend/frontend split would add indirection without buying anything. If
# agent-facing areas are ever carved up, route by crate instead:
#
#   platform = ["crates/sp42-platform/", "crates/sp42-types/"]
#   domain   = ["crates/sp42-citation/", "crates/sp42-patrol/", "crates/sp42-assessment/"]
#   shell    = ["crates/sp42-server/", "crates/sp42-app/", "crates/sp42-cli/", "crates/sp42-mcp/"]
