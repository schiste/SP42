# Aethyme broker configuration for SP42.
#
# Generated by `aethyme init`, then set for how this repository actually ships.
# Schema 1; unknown keys are ignored at runtime and `aethyme certify` warns.

schema = 1

# ── Starting a session: always pass --base main ──────────────────────────────
# Not a config key — a usage rule this repository needs, recorded where the rest
# of the broker's behaviour for SP42 is recorded.
#
# `broker start` picks its base in this order: an explicit `--base`; else
# refs/heads/aethyme/integration if that branch exists; else origin/HEAD; else
# refs/heads/main. The integration branch therefore *wins over main* whenever it
# exists — and under verify-only above, nothing ever promotes to it, so it can
# only ever go stale.
#
# Deleting it does not hold. The broker recreates it from the current checkout's
# HEAD, so with the checkout parked on someone's feature branch, a new session
# branches from that unmerged work. Verified here: with the checkout on
# refactor/split-oversized-functions, `broker start` reported
#
#     Start base: refs/heads/aethyme/integration at 16b00be (integration tip)
#
# i.e. another agent's in-progress commits. With `--base main` the same command
# reported
#
#     Start base: main at 772b8bd (explicit --base)
#
# so use `aethyme broker start --base main --task "..."` in this repository.
# An explicit base is still measured against the default branch, so inherited
# drift stays visible rather than being laundered by the choice.
#
# This is not hypothetical: refs/heads/aethyme/integration had drifted 8 commits
# from main while unpushed, holding two unreviewed security fixes. Those commits
# are now recovered and landed, and the branch is preserved at
# origin/backup/aethyme-integration-2026-09-28.

[promote]
# verify-only, deliberately. The generated default is "auto", which promotes
# verified submissions onto a local `aethyme/integration` branch — and the
# tool's own comment on this key says that mode is for repositories that do NOT
# ship through pull requests, "where a second copy of the work on an integration
# branch costs drift and contributes nothing."
#
# SP42 does ship through pull requests, with required status checks in
# .github/workflows/ci.yml. A second copy of the work on an integration branch
# would be a third place for the code to be, drifting against main and against
# the open PRs. So: verify the merged tree, and let the PR be the only route.
mode = "verify-only"

[delivery]
# The safer delivery route when refs diverge — which they will, since the ADR
# work lands as a stacked chain of branches.
default = "pull_request"
push_session_branches = true

[leases]
# Paths no session should ever claim. Everything here is either generated,
# build output, or local runtime state; leasing any of it would let one agent
# hold a lock that another needs for unrelated work.
ignore = [
    "target/",
    "dist/",
    "coverage/",
    ".aethyme/",
    ".sp42-runtime/",
    ".claude/",
    ".codex/",
    ".chau7/",
    "node_modules/",
    ".tmp/",
]

# [leases.routing] is left unset: SP42 is a single-language workspace, so a
# backend/frontend split would add indirection without buying anything. If
# agent-facing areas are ever carved up, route by crate instead:
#
#   platform = ["crates/sp42-platform/", "crates/sp42-types/"]
#   domain   = ["crates/sp42-citation/", "crates/sp42-patrol/", "crates/sp42-assessment/"]
#   shell    = ["crates/sp42-server/", "crates/sp42-app/", "crates/sp42-cli/", "crates/sp42-mcp/"]
